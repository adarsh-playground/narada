services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: narada
      POSTGRES_USER: narada
      POSTGRES_PASSWORD: narada
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U narada -d narada"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - narada-postgres:/var/lib/postgresql/data

volumes:
  narada-postgres:
