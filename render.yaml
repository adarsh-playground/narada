services:
  - type: web
    name: narada-api-adarsh
    runtime: go
    plan: free
    region: ohio
    buildCommand: ./scripts/build-render.sh
    startCommand: ./bin/migrate && ./scripts/seed-render.sh && ./bin/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: narada-db-adarsh
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: ANSWER_MODEL
        value: gpt-5.6-luna

  - type: web
    name: narada-web-adarsh
    runtime: node
    plan: free
    region: ohio
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://narada-api-adarsh.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://narada-web-adarsh.onrender.com

databases:
  - name: narada-db-adarsh
    plan: free
    region: ohio
    databaseName: narada
    user: narada
    postgresMajorVersion: "17"
